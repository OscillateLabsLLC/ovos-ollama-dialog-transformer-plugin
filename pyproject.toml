[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-ollama-dialog-transformer-plugin"
description = "Dialog transformer for OVOS, designed to return responses from Ollama"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Mike Gray/Oscillate Labs", email = "mike@oscillatelabs.net" },
]
keywords = ["mycroft", "ovos", "neon", "plugin", "tts"]
dynamic = ["version"]
dependencies = [
    "ovos-plugin-manager>=0.8.3",
    "ovos-utils>=0.7.0",
    "requests>=2.32.3",
]

[project.urls]
Homepage = "https://github.com/OscillateLabsLLC/ovos-ollama-dialog-transformer-plugin"

[project.entry-points."opm.transformer.dialog"]
ovos-ollama-dialog-transformer-plugin = "ovos_ollama_dialog_transformer_plugin:OllamaDialogTransformer"

[tool.setuptools.dynamic]
version = { attr = "ovos_ollama_dialog_transformer_plugin.version.__version__" }

[tool.setuptools.packages.find]
include = ["ovos_ollama_dialog_transformer_plugin*"]

[dependency-groups]
dev = ["pytest>=8.3.4", "pytest-cov>=6.0.0"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=ovos_ollama_dialog_transformer_plugin --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.uv]
# Pin setuptools below 81 — 81 removed --dry-run, 82 removed pkg_resources
# entirely. The setuptools high-sev advisory (PackageIndex.download path
# traversal) is build-time only via easy_install which we don't invoke.
# Revisit once the OVOS dep chain confirms importlib.metadata-only paths.
constraint-dependencies = ["setuptools<81"]
